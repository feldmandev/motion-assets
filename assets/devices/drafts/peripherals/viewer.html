(async()=>{const z=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));const data=JSON.parse(await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).text());let type=0,color=data.palettes.findIndex(p=>p.id==='graphite');const el=id=>document.getElementById(id);
data.types.forEach((t,i)=>{const option=document.createElement('option');option.value=i;option.textContent=t.label;el('types').append(option)});
data.palettes.forEach((p,i)=>{const button=document.createElement('button');button.className='color';button.style.setProperty('--swatch',p.stops.mid);button.innerHTML='<span></span>'+p.name;button.onclick=()=>{color=i;draw()};el('colors').append(button)});
function draw(){const t=data.types[type],p=data.palettes[color];el('stage').innerHTML=t.template?t.template.replace(/~(\d+)~/g,(_,i)=>t.variants[p.id][+i]):t.variants[p.id];el('caption').textContent=t.label;el('sub').textContent=p.name;el('count').textContent=(type+1)+' / '+data.types.length;el('types').value=type;Array.from(el('colors').children).forEach((b,i)=>b.setAttribute('aria-pressed',i===color));}
function step(n){type=(type+n+data.types.length)%data.types.length;draw()}
el('types').onchange=e=>{type=+e.target.value;draw()};el('previous').onclick=()=>step(-1);el('next').onclick=()=>step(1);el('background').onclick=()=>{const light=el('stage').classList.toggle('light');el('background').textContent=light?'Dark background':'Light background'};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const n=e.key==='ArrowRight'?1:-1;if(e.shiftKey){color=(color+n+data.palettes.length)%data.palettes.length;draw()}else step(n)});draw();})();
</script></body></html>
